#
# Roles are provisioned idempotently using the naming convention: name = *sdep*
#
roles:
  - name: "sdep_read"
    description: "Permission to read"
  - name: "sdep_write"
    description: "Permission to write"
  - name: "sdep_ca"
    description: "Competent authority (CA)"
  - name: "sdep_str"
    description: "Short-term rental platform (STR)"
  - name: "sdep_sta"
    description: "Statistics authority (STA)"
  - name: "sdep_lsa"
    description: "Listing screening authority (LSA)"
  - name: "sdep_lma"
    description: "Listing monitoring authority (LMA)"
  - name: "sdep_ama"
    description: "Activity monitoring authority (AMA)"
