    secret: "sdep-sta.01"
    name: "Test STA-01 (client id & secret, persistent)"
    description: "For interactive testing (persistent data)"
    service_account_roles:
      - sdep_sta
      - sdep_read

  # 2d. Listing screening authority (LSA)
