[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdformat-sdep"
version = "0.1.0"
description = "SDEP house-style overrides for mdformat (renders thematic breaks as '---')"
requires-python = ">=3.9"
dependencies = ["mdformat"]

[tool.hatch.build.targets.wheel]
include = ["mdformat_sdep.py"]

[project.entry-points."mdformat.parser_extension"]
sdep = "mdformat_sdep"
